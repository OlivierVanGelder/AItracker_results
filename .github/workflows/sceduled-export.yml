name: Scheduled SE Ranking export

on:
  workflow_dispatch:
    inputs:
      guestUrls:
        description: SE Ranking guest URLs, komma gescheiden (optioneel, overschrijft secret)
        required: false
        type: string

jobs:
  run-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npm run pw:install

      - name: Run exporter
        env:
          SE_RANKING_GUEST_URLS: ${{ secrets.SE_RANKING_GUEST_URLS }}
          SE_RANKING_GUEST_URL: ${{ secrets.SE_RANKING_GUEST_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          EXPORT_TIMEOUT_MS: "120000"
        run: |
          node src/run.js \
            ${{ inputs.guestUrls && format('--guestUrls "{0}"', inputs.guestUrls) || '' }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug